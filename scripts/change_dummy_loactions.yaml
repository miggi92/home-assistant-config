---
# Change dummy locations
change_dummy_locations:
  fields:
    who:
      selector:
        select:
          multiple: false
          options:
            - milo
            - finn
            - maja
      name: Who?
      description: Change location of person
      required: true
    target_zone:
      name: "Zone"
      description: "Ziel-Zone auswählen"
      selector:
        entity:
          filter:
            - domain: zone
      required: true

  sequence:
    - variables:
        config:
          milo:
            person_sync: input_select.milo_person_sync
            long: input_number.milo_dummy_long
            lat: input_number.milo_dummy_lat
          finn:
            person_sync: input_select.finn_unterwegs
            long: input_number.finn_dummy_long
            lat: input_number.finn_dummy_lat
          maja:
            person_sync: input_select.maja_person_sync
            long: input_number.maja_dummy_long
            lat: input_number.maja_dummy_lat
        latitude: "{{ state_attr(target_zone, 'latitude') }}"
        longitude: "{{ state_attr(target_zone, 'longitude') }}"
    - action: input_select.select_option
      target:
        entity_id: "{{ config[who].person_sync }}"
      data:
        option: "alleine"
    - action: input_number.set_value
      target:
        entity_id: "{{ config[who].lat }}"
      data:
        value: "{{ latitude }}"
    - action: input_number.set_value
      target:
        entity_id: "{{ config[who].long }}"
      data:
        value: "{{ longitude }}"
