---
# AWTRIX 3 Notifications
awtrix3notif:
  fields:
    text:
      selector:
        text: null
      name: Text
      description: Text Benachrichtigung
    icon:
      selector:
        number:
          min: 0
          max: 100000
      default: 2883
      name: Icon Id
      description: Icon ID
    repeat:
      selector:
        number:
          min: 1
          max: 10
          step: 1
      default: 1
    overlay:
      selector:
        text: null
      name: Overlayeffekt
      description: Overlayeffekt der Benachrichtigung
    device_prefix:
      name: DevicePrefix
      description: MQTT Prefix der Awtrix
      required: false
      default: "90150650ccb4"
      selector:
        text: null
  sequence:
    - variables:
        device_prefix: "{{ device_prefix | default('90150650ccb4') }}"
    - action: mqtt.publish
      metadata: {}
      data:
        topic: "{{ device_prefix }}/cmd/notify"
        payload: |-
          {
            "text": "{{ text }}",
            "icon": "{{ icon }}",
            "repeat": "{{ repeat }}",
            "overlay" : "{{ overlay }}"
          }
  alias: awtrix3Notify
  description: ""
  mode: queued
  max: 10
