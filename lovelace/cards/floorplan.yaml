---
type: picture-elements
image: /local/floorplan/hintergrund.png
elements:
  # --- Basis: Nacht ---------------------------------------------------------
  - type: image
    image: /local/floorplan/night.png
    style:
      pointer-events: none
      left: 50%
      top: 50%
      width: 100%

  # --- Tageslicht, Deckkraft aus Sonnenstand --------------------------------
  - type: custom:config-template-card
    variables:
      TRANSPARENZ: "isNaN(parseFloat(states['sensor.sonnenlicht_transparenz'].state)) ? 0 : states['sensor.sonnenlicht_transparenz'].state"
    entities:
      - sun.sun
      - sensor.sonnenlicht_transparenz
    element:
      type: image
      entity: sun.sun
      image: /local/floorplan/1x1_transparent.png
      state_image:
        above_horizon: /local/floorplan/day.png
      tap_action:
        action: none
      hold_action:
        action: none
    style:
      opacity: ${TRANSPARENZ}
      mix-blend-mode: lighten
      pointer-events: none
      top: 50%
      left: 50%
      width: 100%

  # --- Geräte-Layer ---------------------------------------------------------
  - type: image
    entity: light.tv_licht
    image: /local/floorplan/1x1_transparent.png
    state_image:
      "on": /local/floorplan/tv_licht.png
    style:
      mix-blend-mode: lighten
      pointer-events: none
      left: 50%
      top: 50%
      width: 100%

  # state_image matcht exakt – Media-Player melden je nach Integration
  # playing/paused/idle statt on. standby bewusst nicht gelistet.
  - type: image
    entity: media_player.wztv
    image: /local/floorplan/1x1_transparent.png
    state_image:
      "on": /local/floorplan/wztv.png
      playing: /local/floorplan/wztv.png
      paused: /local/floorplan/wztv.png
      idle: /local/floorplan/wztv.png
    style:
      mix-blend-mode: lighten
      pointer-events: none
      left: 50%
      top: 50%
      width: 100%

  - type: image
    entity: light.esstischlicht
    image: /local/floorplan/1x1_transparent.png
    state_image:
