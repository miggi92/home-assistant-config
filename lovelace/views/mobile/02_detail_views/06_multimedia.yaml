---
title: Multimedia
path: multimedia
icon: mdi:multimedia
subview: true
type: sections
max_columns: 3
badges:
  - type: custom:mushroom-template-badge
    icon: mdi:arrow-left
    tap_action:
      action: navigate
      navigation_path: start
sections:
  - type: grid
    cards:
      - type: custom:mini-media-player
        entity: media_player.spotify_miguel
        artwork: full-cover
        hide:
          power: true
          volume: true
          controls: true
          source: true
          progress: true
      - type: custom:mini-media-player
        entity: media_player.fernseher_im_wohnzimmer
        artwork: full-cover
        hide:
          source: true
          volume: true
          power_state: false
      - type: custom:mini-media-player
        entity: media_player.gtv
        artwork: full-cover
        hide:
          source: true
          volume: true
          power_state: false
  - type: grid
    cards:
      - type: custom:upcoming-media-card
        entity: sensor.sonarr_upcoming_media
      - type: custom:upcoming-media-card
        entity: sensor.radarr_upcoming_media
  - type: grid
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.radarr_filme
      - type: custom:mushroom-entity-card
        entity: sensor.sonarr_sendungen
      - type: custom:mushroom-entity-card
        entity: sensor.radarr_warteschlange
      - type: custom:mushroom-entity-card
        entity: sensor.sonarr_warteschlange
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.sonarr_warteschlange
            state_not: "0"
        card:
          type: markdown
          content: >
            {%- for attr, value in states.sensor.sonarr_warteschlange.attributes.items() %}
              {%- if attr not in ['unit_of_measurement', 'friendly_name', 'icon'] %}
                <ha-icon icon="mdi:television-classic"></ha-icon> **{{ attr }}**: {{ value }}
              {%- endif %}
            {%- endfor %}
