---
alias: "Check FordPass Last Refresh"
id: af2a6157-b2f2-4b20-94cc-d2c6b8bc48f5
description: >
  Adaptives FordPass-Polling. Das Intervall misst das Alter der Daten
  (sensor.*_lastrefresh). Zusaetzlich verhindert ein Pending-Guard, dass
  nachgedrueckt wird, solange eine Anfrage noch unterwegs ist - sonst
  laeuft die Automation ins Dauerfeuer, wenn Ford nicht antwortet.
mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/1"
    id: "trigger_periodic"
    alias: "Hintergrund-Tick jede Minute"

  - trigger: state
    entity_id: sensor.fordpass_tourneo_ignitionstatus
    to: "ON"
    id: "trigger_car_active"
    alias: "Zuendung an"

  - trigger: state
    entity_id:
      - binary_sensor.pixel_9_pro_android_auto
      - binary_sensor.pixel_10_pro_android_auto
    to: "on"
    id: "trigger_car_active"
    alias: "Android Auto verbunden"

  - trigger: state
    entity_id: group.parents
    to: "not_home"
    id: "trigger_parent_left"
    alias: "Eltern-Gruppe verlaesst home"

conditions:
  - alias: "12V-Batterie hat genug Reserve"
    condition: numeric_state
    entity_id: sensor.fordpass_tourneo_battery
    above: 70

actions:
  - alias: "Berechnungsvariablen"
    variables:
      refresh_ts: >
        {% set dt = states('sensor.fordpass_tourneo_lastrefresh') | as_datetime %}
        {{ (dt | as_timestamp) | float(0) if dt else 0 }}
      press_ts: >
        {% set p = states('button.fordpass_tourneo_request_refresh') | as_datetime %}
        {{ (p | as_timestamp) | float(0) if p else 0 }}
      time_since_refresh: >
        {{ (now().timestamp() - refresh_ts | float(0))
          if refresh_ts | float(0) > 0 else 99999 }}
      api_timeout: 120
      request_pending: >
        {{ press_ts | float(0) > refresh_ts | float(0)
          and (now().timestamp() - press_ts | float(0)) < api_timeout | float(0) }}
      is_away: >
        {{ states('device_tracker.fordpass_tourneo_tracker')
          not in ['home', 'unknown', 'unavailable'] }}
      is_driving: >
        {{ is_state('sensor.fordpass_tourneo_ignitionstatus', 'ON')
          or is_state('binary_sensor.pixel_9_pro_android_auto', 'on')
          or is_state('binary_sensor.pixel_10_pro_android_auto', 'on') }}
      is_charging: "{{ is_state('sensor.fordpass_tourneo_elvehcharging', 'IN_PROGRESS') }}"
      interval_driving: 60
      interval_charging: 300
      interval_parked_away: 900
      interval_idle: 3600
  - alias: "Sofort-Update, weil gerade ein Ereignis eingetreten ist"
    if:
      - condition: trigger
        id:
          - "trigger_car_active"
          - "trigger_parent_left"
    then:
      - action: button.press
        target:
          entity_id: button.fordpass_tourneo_request_refresh
        alias: "Refresh anfordern (sofort)"
      - stop: "Sofort-Update ausgeloest, Intervall-Logik uebersprungen"

  - alias: "Abbrechen, solange eine Anfrage noch unterwegs ist"
    condition: template
    value_template: "{{ not request_pending }}"

  - alias: "Intervall nach Fahrzeugzustand"
    choose:
      - alias: "Fahrt - Zuendung an oder Android Auto verbunden"
        conditions:
          - condition: template
            value_template: "{{ is_driving }}"
          - condition: template
            value_template: "{{ time_since_refresh | float >= interval_driving }}"
        sequence:
          - action: button.press
            target:
              entity_id: button.fordpass_tourneo_request_refresh
            alias: "Refresh anfordern (Fahrt)"

      - alias: "Ladevorgang laeuft"
        conditions:
          - condition: template
            value_template: "{{ is_charging }}"
          - condition: template
            value_template: "{{ time_since_refresh | float >= interval_charging }}"
        sequence:
          - action: button.press
            target:
              entity_id: button.fordpass_tourneo_request_refresh
            alias: "Refresh anfordern (Laden)"

      - alias: "Auswaerts geparkt - Zuendung aus, nicht zu Hause"
        conditions:
          - condition: template
            value_template: "{{ is_away }}"
          - condition: template
            value_template: "{{ time_since_refresh | float >= interval_parked_away }}"
        sequence:
          - action: button.press
            target:
              entity_id: button.fordpass_tourneo_request_refresh
            alias: "Refresh anfordern (auswaerts geparkt)"

      - alias: "Idle - steht zu Hause"
        conditions:
          - condition: template
            value_template: "{{ time_since_refresh | float >= interval_idle }}"
        sequence:
          - action: button.press
            target:
              entity_id: button.fordpass_tourneo_request_refresh
            alias: "Refresh anfordern (Idle)"
