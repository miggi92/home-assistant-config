---
# Todays Birds.
alias: todaysBirds
description: "Generiert eine Collage der heute gehörten Vögel und zeigt sie auf dem PhotoPainter"
id: 2cafed2b-add1-4d50-bb3c-d73292c17764
triggers:
  - trigger: state
    entity_id: sensor.birdnet_daily
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
conditions: []

actions:
  - alias: Set variables for bird count and image prompt
    variables:
      bird_count: "{{ states('sensor.birdnet_daily') | int(0) }}"
      todays_birds: >-
        {% set ns = namespace(names=[]) %}
        {% if bird_count > 0 %}
          {% for bird in state_attr('sensor.birdnet_daily', 'birds') or [] %}
            {% set ns.names = ns.names + [bird.common_name | default(bird.scientific_name)] %}
          {% endfor %}
        {% endif %}
        {{ ns.names | unique | list | join(', ') }}
      image_prompt: >-
        {% if bird_count == 0 %}
          A fine art painting in the style of a classic naturalist watercolour
          illustration. Vertical portrait composition, aspect ratio 3:5
          (e.g. 480x800 pixels). An elegant composition featuring an empty,
          intricate bird nest resting on a branch. Soft, painterly textures
          with visible brushstrokes and gentle washes of colour. Hand-painted
          branches, leaves, and foliage on a softly tinted parchment-like
          background. Muted, natural tones with warm light. Keep all important
          elements centered, away from the image edges.
          No text, no words, no labels, no watermarks.
        {% else %}
          A fine art painting in the style of a classic naturalist watercolour
          illustration, reminiscent of vintage ornithological field guides.
          Vertical portrait composition, aspect ratio 3:5 (e.g. 480x800 pixels),
          like a single upright plate from a field guide.
          An elegant composition featuring these European bird species, each
          rendered with delicate brushwork, true to its real-life appearance:
          {{ todays_birds }}.
          Each bird is labeled directly beneath it with its species name in
          small, elegant handwritten script, as found in a vintage
          ornithological field guide. The labels must spell the names exactly
          as given: {{ todays_birds }}.
          Soft, painterly textures with visible brushstrokes and gentle washes
          of colour. The birds are arranged vertically and harmoniously among
          hand-painted branches, leaves, and foliage on a softly tinted
          parchment-like background. Muted, natural tones with warm light.
          Detailed yet artistic, evoking the work of John James Audubon.
          Keep all birds and labels centered, away from the image edges.
          No other text besides these labels, no watermarks.
        {% endif %}
  - alias: Generate AI image based on bird count
    action: ai_task.generate_image
    data:
      task_name: "Todays birds"
      instructions: "{{ image_prompt }}"
    response_variable: birds

  - alias: Only continue if image was generated
    condition: template
    value_template: "{{ birds.url is defined }}"

  - alias: Update E-Ink PhotoPainter
    action: opendisplay.upload_image
    continue_on_error: true
    data:
      device_id: dc6d22fea18511f41160667e0eac1088
      rotation: 270
      dither_mode: burkes
      refresh_mode: full
      fit_mode: cover
      image:
        media_content_id: "{{ birds.media_source_id }}"
        media_content_type: "{{ birds.mime_type | default('image/png') }}"

  - alias: Download the generated image file
    action: downloader.download_file
    data:
      overwrite: true
      url: "http://localhost:8123{{ birds.url }}"
      filename: "todays_birds.png"
      subdir: "birds"
  - alias: Update cache buster to refresh UI
    action: input_text.set_value
    target:
      entity_id: input_text.meal_image_cache_buster
    data:
      value: "{{ as_timestamp(now()) }}"
mode: queued
