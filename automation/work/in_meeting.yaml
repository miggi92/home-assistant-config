---
# Meeting info
alias: inMeeting
id: d1c10388-a5c9-4749-b035-76776b593a00
description: "Show in meeting info"
triggers:
  - trigger: state
    entity_id: binary_sensor.bcwmc5cg4100cy0_isinmeeting
    to:
      - "on"
      - "off"
conditions: []
actions:
  - if:
      - condition: state
        entity_id: binary_sensor.bcwmc5cg4100cy0_isinmeeting
        state: "on"
        alias: "Check if meeting started"
    then:
      - alias: "Show Meeting on Clock"
        action: script.awtrix_app
        data:
          app_id: meeting
          text: "In meeting"
          icon: "9603"
          # Falls der Laptop-Agent abstuerzt, raeumt sich die App nach 4 h auf
          lifetime_ms: 14400000
      - action: notify.tvoverlaynotifyfixed
        data:
          data:
            id: meeting
            icon: mdi:video-plus
            expiration: 30m
            shape: rounded
            iconColor: "#880808"
          message: "null"
          title: "Meeting"
      - action: switch.turn_on
        target:
          entity_id: switch.buro_echo_buro_bitte_nicht_storen
    else:
      - alias: "Remove Meeting from Clock"
        action: script.awtrix_app
        data:
          app_id: meeting
          show: false
      - action: notify.tvoverlaynotifyfixed
        data:
          data:
            id: meeting
            icon: mdi:video-plus
            expiration: 2m
            shape: rounded
            visible: false
          message: "null"
      - action: switch.turn_off
        target:
          entity_id: switch.buro_echo_buro_bitte_nicht_storen
mode: queued
max: 5
