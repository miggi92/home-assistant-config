---
# notify about the meals
alias: workMeals
id: a601d3fe-17d3-4cff-9eb1-ea4bbca2c549
description: "Notify about the work meals"
trigger:
  - trigger: time
    at: "11:15:00"
    alias: "Trigger at 11:00 AM"
condition:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: "on"
    alias: "Check if it is a workday"
  - condition: state
    entity_id: schedule.buro_tage
    state: "on"
    alias: "Check if office schedule is active"
  - condition: not
    conditions:
      - condition: state
        entity_id: person.miguel
        state: "home"
    alias: "Ensure Miguel is not at home"
action:
  - alias: "Iterate through all work meal items"
    repeat:
      for_each:
        - "one"
        - "one_two"
        - "three"
        - "four"
        - "five"
        - "six"
      sequence:
        - action: script.notify_engine
          alias: "Send notification for current meal"
          data:
            title: |
              🍴 Heutiges Essen im Geschäft 🍽️
            value1: |
              Heute im Geschäft gibt es folgende Gerichte:
            who: "home"
            tag_id: "information"
            group: "Work"
            photo:
              path: "{{ states('input_text.local_url') }}{{ state_attr('image.work_meal_' ~ repeat.item, 'entity_picture') }}"
              caption: "{{ states('input_text.work_meal_' ~ repeat.item) }}"

  - action: smtp.send_message
    target:
      entity_id: notify.kohgeb_family_home_miguel_arbeit
    data:
      title: Speiseplan
      message: Heutiger Speiseplan
      html: >
        <html>
          <body>
            Heutiger Speiseplan<br><br>
            <img src="cid:work_meal_one"><br>
            <img src="cid:work_meal_one_two"><br>
            <img src="cid:work_meal_three"><br>
            <img src="cid:work_meal_four"><br>
            <img src="cid:work_meal_five"><br>
            <img src="cid:work_meal_six">
          </body>
        </html>
      attachments:
        - file: /config/www/downloaded/work_meals/work_meal_one.png
          filename: work_meal_one.png
          content_id: work_meal_one
        - file: /config/www/downloaded/work_meals/work_meal_one_two.png
          filename: work_meal_one_two.png
          content_id: work_meal_one_two
        - file: /config/www/downloaded/work_meals/work_meal_three.png
          filename: work_meal_three.png
          content_id: work_meal_three
        - file: /config/www/downloaded/work_meals/work_meal_four.png
          filename: work_meal_four.png
          content_id: work_meal_four
        - file: /config/www/downloaded/work_meals/work_meal_five.png
          filename: work_meal_five.png
          content_id: work_meal_five
        - file: /config/www/downloaded/work_meals/work_meal_six.png
          filename: work_meal_six.png
          content_id: work_meal_six
mode: single
