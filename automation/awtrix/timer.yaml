---
alias: AWTRIX · Alexa-Timer
id: 2c96d793-ea37-49cb-89c2-972a4518789b
description: "Zeigt laufende Alexa-Timer als Fortschrittsbalken"
triggers:
  - trigger: state
    entity_id:
      - sensor.buro_echo_buro_nachster_timer
      - sensor.echo_show_nachster_timer
      - sensor.milos_dot_nachster_timer
  - trigger: time_pattern
    seconds: "/10"
    id: tick
variables:
  timers:
    - entity_id: sensor.buro_echo_buro_nachster_timer
      id: office
      text: "Büro"
      icon: "8135"
    - entity_id: sensor.echo_show_nachster_timer
      id: kitchen
      text: "Küche"
      icon: "57796"
    - entity_id: sensor.milos_dot_nachster_timer
      id: living
      text: "Wohnzimmer"
      icon: "63810"
conditions:
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ trigger is not defined or trigger.id != 'tick' }}"
      - condition: template
        value_template: >-
          {{ timers | map(attribute='entity_id') | map('states')
            | select('match', '^\d{4}-') | list | count > 0 }}
actions:
  - repeat:
      for_each: "{{ timers }}"
      sequence:
        - action: script.awtrix_app
          data:
            app_id: "timer_{{ repeat.item.id }}"
            show: >-
              {% set e = states(repeat.item.entity_id) | as_datetime(default=none) %}
              {{ e is not none and e > now() }}
            text: "{{ repeat.item.text }}"
            icon: "{{ repeat.item.icon }}"
            progress: >-
              {% set e = states(repeat.item.entity_id) | as_datetime(default=none) %}
              {% if e is none or e <= now() %}-1
              {% else %}
                {% set s = states[repeat.item.entity_id].last_changed %}
                {% set total = (e - s).total_seconds() %}
                {% if total > 0 %}
                  {{ [[0, ((now() - s).total_seconds() / total * 100) | round(0) | int] | max, 100] | min }}
                {% else %}0{% endif %}
              {% endif %}
            lifetime_ms: 60000
mode: restart
max_exceeded: silent
