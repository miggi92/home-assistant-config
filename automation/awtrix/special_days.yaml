---
# 14397
alias: Show special days on clock
id: 10af4661-0fb0-4b0e-9b0d-e5ae7d251d93
description: "Show special days on clock"
triggers:
  - trigger: time
    at: "00:01:00"
  - trigger: time
    at: "11:11:00"
    id: "fasnacht"
  - trigger: state
    entity_id: sensor.special_day
conditions: []
actions:
  - variables:
      max_apps: 5
      special_days: >-
        {{ states('sensor.special_day').split(',')
          | map('trim')
          | reject('in', ['none', '', 'unknown', 'unavailable'])
          | list }}
      icons: >-
        {{ states('sensor.wohnzimmer_awtrix_ng_special_day_icon_awtrix').split(',')
          | map('trim')
          | list }}

  - alias: Aktive Special Days anzeigen
    repeat:
      for_each: "{{ special_days[:max_apps] }}"
      sequence:
        - action: script.awtrix_app
          data:
            app_id: "special_day_{{ repeat.index }}"
            text: >-
              {%- if repeat.item == 'Stern' -%}
                {{ ' ' }}
              {%- elif repeat.item == 'Hochzeitstag' -%}
                {{ states('sensor.anniversaries_hochzeitstagsname') }}
              {%- else -%}
                {{ repeat.item }}
              {%- endif -%}
            icon: >-
              {{ icons[repeat.index - 1]
                if icons | length >= repeat.index
                else icons[0] | default('') }}
            lifetime_ms: 90000000

  - alias: Uebrige Apps aufraeumen
    repeat:
      count: "{{ [0, max_apps - (special_days | length)] | max }}"
      sequence:
        - action: script.awtrix_app
          data:
            app_id: "special_day_{{ (special_days | length) + repeat.index }}"
            show: false

  - alias: Fasnacht-Sound
    if:
      - condition: template
        value_template: "{{ 'Fasnachtszeit' in special_days }}"
      - condition: trigger
        id: "fasnacht"
    then:
      - action: script.spotify_audio
        data:
          volume: 0.6
          type: song
          media_id: >-
            https://open.spotify.com/intl-de/track/1PnokXw6l4LGNaxl68ESRJ
          source: Echo_Show
mode: single
