---
# Ersetzt lights_on / doors_open / hot_beverages / bed.
alias: AWTRIX · Zähler & Status
id: 7d21c4ab-3e55-4a90-b1f2-8c0e6d93aa41
description: "Lichter, Türen, Heißgetränke und Bett-Status auf der Uhr"
triggers:
  - trigger: state
    entity_id:
      - number.count_lights_on
      - number.count_doors_open
      - input_number.heissgetranke_zahler
      - binary_sensor.bett_tracker
conditions: []
actions:
  - alias: Zaehler
    repeat:
      for_each:
        - entity_id: number.count_lights_on
          app_id: lights
          icon: "1762"
        - entity_id: number.count_doors_open
          app_id: doors
          icon: "9766"
        - entity_id: input_number.heissgetranke_zahler
          app_id: coffee
          icon: "14060"
      sequence:
        - action: script.awtrix_app
          data:
            app_id: "{{ repeat.item.app_id }}"
            show: "{{ states(repeat.item.entity_id) | int(0) > 0 }}"
            text: "{{ states(repeat.item.entity_id) | int(0) }}"
            icon: "{{ repeat.item.icon }}"
  - alias: Bett
    action: script.awtrix_app
    data:
      app_id: bed
      show: "{{ is_state('binary_sensor.bett_tracker', 'on') }}"
      text: "Zz Zz Zz Zz Zz Zz"
      icon: "19723"
mode: queued
max: 10
