---
# Display dwd warnings
alias: Show dwd warning on clock
id: 6ce30133-5f41-456c-a80f-111fbe92bd0c
description: "Show dwd warning on clock"
triggers:
  - trigger: state
    entity_id: sensor.home_aktuelle_warnstufe
conditions: []
actions:
  - variables:
      max_apps: 5
      warn_count: >-
        {{ [state_attr('sensor.home_aktuelle_warnstufe', 'warning_count') | int(0),
            max_apps] | min }}
  - alias: Aktive Warnungen anzeigen
    repeat:
      count: "{{ warn_count }}"
      sequence:
        - action: script.awtrix_app
          data:
            app_id: "dwd_{{ repeat.index }}"
            text: >-
              {{ state_attr('sensor.home_aktuelle_warnstufe',
                'warning_' ~ repeat.index ~ '_name') }}
            icon: "6874"
            # Warnung laeuft aus, auch wenn der Sensor haengen bleibt
            lifetime_ms: 21600000
  - alias: Uebrige Warn-Apps aufraeumen
    repeat:
      count: "{{ max_apps - warn_count }}"
      sequence:
        - action: script.awtrix_app
          data:
            app_id: "dwd_{{ warn_count + repeat.index }}"
            show: false
mode: single
