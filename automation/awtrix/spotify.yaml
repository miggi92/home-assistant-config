---
# Spotify
alias: Show spotify on the clock
id: 65f0caac-6ebc-4025-af11-4ef6bf3b75e1
description: "Show spotify on the clock"
triggers:
  - trigger: state
    entity_id: media_player.spotify_miguel
conditions:
  - condition: state
    entity_id: group.parents
    state: "home"
actions:
  - action: script.awtrix_app
    data:
      app_id: spotify
      show: "{{ is_state('media_player.spotify_miguel', 'playing') }}"
      text: "{{ state_attr('media_player.spotify_miguel', 'media_title') | default('', true) }}"
      icon: "12676"
      repeat: 1
      # Falls HA den Stop-Event verpasst, raeumt sich die App selbst auf
      lifetime_ms: 900000
mode: restart
