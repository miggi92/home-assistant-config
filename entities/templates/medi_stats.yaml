---
# medis stats
- triggers:
    - trigger: select.selection_changed
      target:
        label_id: medis
      id: log
    - trigger: time
      at: "00:05:00"
      id: prune
  actions:
    - variables:
        eid: >
          {{ trigger.entity_id if trigger.entity_id is defined
            else (trigger.to_state.entity_id if trigger.to_state is defined else none) }}
        cutoff: "{{ as_timestamp(now()) - 7 * 86400 }}"
        pruned: >
          {{ (state_attr('sensor.medis_wochenstatistik', 'log') or [])
            | selectattr('ts', 'ge', cutoff | float) | list }}
        new_log: >
          {% if trigger.id == 'log' and eid
                and states(eid) in ['genommen', 'übersprungen'] %}
            {{ pruned + [{
                'med': state_attr(eid, 'friendly_name') | default('?')
                        | regex_replace('^[Mm]edis[ _]+', '') | trim,
                'state': states(eid),
                'ts': as_timestamp(now())
              }] }}
          {% else %}
            {{ pruned }}
          {% endif %}
  sensor:
    - name: "Medis Wochenstatistik"
      unique_id: medis_wochenstatistik
      state: "{{ new_log | count }}"
      icon: mdi:chart-bell-curve-cumulative
      attributes:
        log: "{{ new_log }}"
