color:
  # >>> Akzentfarbe des UI: hier den Hex-Wert von light_blue aendern.
  - id: light_blue
    hex: 'CFE2F3'
  - id: white
    hex: 'ffffff'
  - id: black
    hex: '000000'
  - id: red
    hex: 'FF3131'
  - id: dim
    hex: '5A6B7D'   # gedaempfte Nebeninfos

spi:
  clk_pin: 7
  mosi_pin: 6

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    invert_colors: false
    pages:
      ##########################################################################
      #  IDLE — der Screen, den du 99% der Zeit siehst.
      #  Aufbau von oben nach unten:
      #    Datum  /  grosse Uhr  /  Innen + Aussen  /  naechster Termin
      #  Der Screensaver aendert daran nichts, er dimmt nur.
      ##########################################################################
      - id: idle_page
        lambda: |-
          it.fill(id(black));

          const char *days[] {"${sunday}","${monday}","${tuesday}","${wednesday}","${thursday}","${friday}","${saturday}"};
          const char *months[] {"${jan}","${feb}","${mar}","${apr}","${may}","${jun}","${jul}","${aug}","${sept}","${oct}","${nov}","${dec}"};

          // --- Datum ---
          it.printf(160, 22, id(my_font5), light_blue, TextAlign::CENTER,
                    "%s %d. %s",
                    days[id(ha_time).now().day_of_week - 1],
                    id(ha_time).now().day_of_month,
                    months[id(ha_time).now().month - 1]);

          // --- Uhrzeit (gross) ---
          if(id(time_display_format).state == "24 Hr") {
            it.strftime(160, 78, id(my_font82), white, TextAlign::CENTER, "%H:%M", id(ha_time).now());
          } else {
            it.strftime(160, 78, id(my_font2), white, TextAlign::CENTER, "%l:%M%p", id(ha_time).now());
          }

          // --- Temperaturen: innen links, aussen rechts ---
          // has_state() verhindert "nan°" solange HA/Sensor noch keinen Wert geliefert hat
          if (id(s3temp).has_state()) {
            it.printf(88, 150, id(my_font4), light_blue, TextAlign::CENTER, "%.0f°", id(s3temp).state);
          } else {
            it.printf(88, 150, id(my_font4), dim, TextAlign::CENTER, "--°");
          }
          it.printf(88, 172, id(my_font), dim, TextAlign::CENTER, "innen");
          if (id(outside_temp).has_state()) {
            it.printf(232, 150, id(my_font4), light_blue, TextAlign::CENTER, "%.0f°", id(outside_temp).state);
          } else {
            it.printf(232, 150, id(my_font4), dim, TextAlign::CENTER, "--°");
          }
          it.printf(232, 172, id(my_font), dim, TextAlign::CENTER, "außen");

          // --- Trennlinie ---
          it.line(40, 192, 280, 192, dim);

          // --- Naechster Termin (kein Termin = Zeile bleibt frei) ---
          // HA liefert bei leerem Kalender "unknown"/"unavailable" statt Leerstring
          std::string ct = id(cal_title).state;
          if (!ct.empty() && ct != "unknown" && ct != "unavailable" && ct != "None") {
            if (ct.length() > 26) { ct = ct.substr(0, 25) + "..."; }
            // Startzeit kommt als "YYYY-MM-DD HH:MM:SS" -> Zeichen 11..15 = HH:MM
            std::string uhr = "";
            std::string cs = id(cal_start).state;
            if (cs.length() >= 16 && cs != "unknown" && cs != "unavailable") {
              uhr = cs.substr(11, 5);
            }
            if (!uhr.empty()) {
              it.printf(160, 212, id(my_font16), light_blue, TextAlign::CENTER, "%s  %s", uhr.c_str(), ct.c_str());
            } else {
              it.printf(160, 212, id(my_font16), light_blue, TextAlign::CENTER, "%s", ct.c_str());
            }
          }

          // --- dezente Warnhinweise unten rechts, nur wenn noetig ---
          if (id(mute_switch).state) {
            it.printf(305, 228, id(my_font), red, TextAlign::BASELINE_RIGHT, "stumm");
          } else if (id(wifi_connection) != true) {
            it.printf(305, 228, id(my_font), red, TextAlign::BASELINE_RIGHT, "kein WLAN");
          } else if (id(api_connection) != true) {
            it.printf(305, 228, id(my_font), red, TextAlign::BASELINE_RIGHT, "kein HA");
          }

      ##########################################################################
      #  Sprachassistent
      ##########################################################################
      - id: listening_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(listening_img), ImageAlign::CENTER);

      - id: thinking_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(thinking_img), ImageAlign::CENTER);
          if (id(display_conversation).state) {
            it.filled_rectangle(0 , 0 , 320 , 30 , Color::WHITE );
            it.printf(10, 10, id(my_font16), Color::BLACK, "%s", id(text_request).state.c_str());
          }

      - id: replying_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(replying_img), ImageAlign::CENTER);
          if (id(display_conversation).state) {
            it.filled_rectangle(0 , 0 , 320 , 30 , Color::WHITE );
            it.filled_rectangle(0 , 210 , 320 , 30 , Color::WHITE );
            it.printf(10, 10, id(my_font16), Color::BLACK, "%s", id(text_request).state.c_str());
            it.printf(10, 220, id(my_font16), Color::BLACK, "%s", id(text_response).state.c_str());
          }

      - id: error_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_img), ImageAlign::CENTER);

      ##########################################################################
      #  Timer
      ##########################################################################
      - id: time_remaining_page
        lambda: |-
          it.fill(id(black));
          it.printf(160, 45, id(my_font5), light_blue, TextAlign::CENTER, "Timer");
          it.printf(160, 140, id(my_font6), white, TextAlign::CENTER, "%s", id(time_remaining_0).state.c_str());

      - id: timer_finished_page
        lambda: |-
          it.fill(id(black));
          it.printf(160, 110, id(icon_font_180), light_blue, TextAlign::CENTER, "\U000F009E");
          it.printf(160, 210, id(my_font5), light_blue, TextAlign::CENTER, "Timer abgelaufen");

      ##########################################################################
      #  System
      ##########################################################################
      - id: loading_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(loading_img), ImageAlign::CENTER);

      - id: ota_page
        lambda: |-
          it.fill(Color::BLACK);
          it.printf(160, 70, id(icon_font_80), red, TextAlign::CENTER, "\U000F08D6");
          it.printf(160, 130, id(my_font3), red, TextAlign::CENTER, "FIRMWARE UPDATE");
          it.printf(160, 175, id(my_font5), light_blue, TextAlign::CENTER, "Nach dem Neustart");
          it.printf(160, 205, id(my_font5), light_blue, TextAlign::CENTER, "Gerät neu booten");

      - id: notification_page
        lambda: |-
          it.fill(Color::BLACK);
          const char* text = id(notification_text).state.c_str();
          int max_chars_per_line = 14;
          int line_height = 40;
          int display_width = 320;
          int display_height = 240;
          int y = 60;
          std::vector<std::string> lines;

          std::string current_line;
          for (const char* p = text; *p != '\0'; ++p) {
            if (current_line.length() >= max_chars_per_line || *p == '\n') {
              lines.push_back(current_line);
              current_line.clear();
              if (*p != '\n') {
                current_line += *p;
              }
            } else {
              current_line += *p;
            }
          }
          if (!current_line.empty()) {
            lines.push_back(current_line);
          }

          int total_height = lines.size() * line_height;
          y = (display_height - total_height) / 2;

          for (const auto& line : lines) {
            int line_width = line.length() * 21;
            int x = (display_width - line_width) / 2;
            it.printf(x, y, id(my_font4), Color::WHITE, TextAlign::BASELINE_LEFT, "%s", line.c_str());
            y += line_height;
          }